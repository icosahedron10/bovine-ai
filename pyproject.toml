[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bovine-ai"
version = "0.1.0"
description = "Paper-guided reproduction pipeline for sticker-based B3/B4 cattle weight estimation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "joblib",
  "matplotlib",
  "numpy",
  "pandas",
  "Pillow",
  "pyarrow",
  "pyyaml",
  "scikit-learn",
  "scipy",
  "typer",
  "tqdm",
]

[project.optional-dependencies]
cv = [
  "depth_pro @ git+https://github.com/apple/ml-depth-pro.git",
  "kaggle",
  "opencv-python",
  "torch",
  "torchvision",
  "timm",
]
test = [
  "pytest",
]

[project.scripts]
cw = "cattle_weight.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
