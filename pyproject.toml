[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bovine-ai"
version = "0.1.0"
description = "Paper-guided reproduction pipeline for sticker-based B3/B4 cattle weight estimation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "joblib==1.5.3",
  "matplotlib==3.10.8",
  "numpy==1.26.4",
  "pandas==2.3.3",
  "Pillow==12.1.1",
  "pyarrow==23.0.1",
  "PyYAML==6.0.3",
  "scikit-learn==1.7.1",
  "scipy==1.17.1",
  "typer==0.24.1",
  "tqdm==4.68.1",
]

[project.optional-dependencies]
cv = [
  "depth_pro @ git+https://github.com/apple/ml-depth-pro.git@9efe5c1def37a26c5367a71df664b18e1306c708",
  "kaggle==2.2.1",
  "opencv-python==4.13.0.92",
  "torch==2.10.0",
  "torchvision==0.25.0",
  "timm==1.0.26",
]
test = [
  "pytest==8.4.2",
]

[project.scripts]
cw = "cattle_weight.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
